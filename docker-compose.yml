services:
  # ==============================
  # Neo4j Graph Database
  # ==============================
  neo4j:
    image: neo4j:5-community
    container_name: trustguardian-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/trustguardian_dev
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ==============================
  # PostgreSQL (standalone — use if not using Supabase cloud)
  # ==============================
  postgres:
    image: postgres:16-alpine
    container_name: trustguardian-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: trustguardian
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: trustguardian_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data:
